name: Publish Docker image

# Builds and publishes the Triage images to the GitHub Container Registry (GHCR)
# so a deployment only needs the compose file — never a git checkout:
#
#   * triage       — single container: PocketBase + SPA + migrations + hooks
#   * triage-push  — Web Push worker that sends scheduled study reminders
#
#   docker compose pull && docker compose up -d
#
# Runs on pushes to main, on version tags (v*), and on demand.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: triage
            image: ${{ github.repository_owner }}/triage
            context: .
            title: Triage
            description: Tell Triage what's due. Triage tells you what to work on.
          - name: triage-push
            image: ${{ github.repository_owner }}/triage-push
            context: ./push-server
            title: Triage push worker
            description: Web Push worker delivering scheduled study reminders for Triage.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read application version
        id: version
        run: echo "value=$(node -p "require('./version.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.value }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.name == 'triage' && format('APP_VERSION={0}', steps.version.outputs.value) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
